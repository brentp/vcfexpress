[package]
name = "vcfexpress"
version = "0.3.4"
edition = "2021"
authors = ["Brent Pedersen <bpederse@gmail.com>"]
description = "A tool for filtering VCF files using Lua expressions"
readme = "README.md"
homepage = "https://github.com/brentp/vcfexpress"
license = "MIT"


[dependencies]
mlua = { version = "0.10.3", features = [
    #"lua54",
    "luau", # required
    "send",
    #"module",
] }
rust-htslib = { version = "0.47.0", features = ["libdeflate", "static"] }
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.3"
log = "0.4.21"
parking_lot = { version = "0.12.3", features = ["arc_lock"] }
#libc = "0.2.153"
libc = "0.2"
mimalloc = "0.1.43"
rustc-hash = "2.0.0"

[[bin]]
name = "vcfexpress"
src = "src/main.rs"

[lib]
name = "vcfexpress"
src = "src/lib.rs"
crate-type = ["rlib", "cdylib"]


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
