name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Clippy
      run: cargo clippy
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  test_csq:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Luau
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
        unzip -o /tmp/luau.zip luau -d "$HOME/.local/bin"
        chmod +x "$HOME/.local/bin/luau"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Run luau csq tests
      run: luau scripts/csq.lua -a test
